[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ripper"
version = "0.1.0"
description = "TDX API to QuestDB market data ingestion"
readme = "docs/tdx_api_questdb_design.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "questdb>=2.0.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
prefect = ["prefect>=3.1.16"]
dev = ["prefect>=3.1.16", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
